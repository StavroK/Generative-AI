name: Portfolio CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile ai-program-risk-dashboard/app.py
          python -m py_compile enterprise-rag-aws/rag_demo/app.py
          python -m py_compile enterprise-rag-aws/rag_demo/mock_adapters.py

      - name: Install test tooling
        run: pip install pytest

      - name: Run RAG unit tests
        run: pytest enterprise-rag-aws/tests -q

      - name: Terraform format check
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform formatting
        run: terraform fmt -check -recursive enterprise-rag-aws/terraform
